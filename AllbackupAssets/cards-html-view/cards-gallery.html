<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>江湖对决 · 全卡牌图鉴 v5</title>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0c; --card-w: 340px; --card-h: 510px;
  --gold: #c8a45c; --gold-dim: #7a6238; --ocean: #0ea5e9;
  --text-primary: #e8e0d5; --text-dim: #8a8070;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg); min-height:100vh;
  font-family:'ZCOOL XiaoWei','Microsoft YaHei',serif;
  overflow-x:hidden;
}

/* ═══ Atmosphere ═══ */
.bg-grain{position:fixed;inset:0;opacity:.05;pointer-events:none;z-index:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
}
.bg-ink1{position:fixed;top:10%;left:5%;width:600px;height:600px;background:radial-gradient(ellipse at center,rgba(109,40,217,.06),transparent 70%);filter:blur(60px);pointer-events:none;z-index:0}
.bg-ink2{position:fixed;bottom:5%;right:0;width:500px;height:500px;background:radial-gradient(ellipse at center,rgba(14,165,233,.04),transparent 70%);filter:blur(50px);pointer-events:none;z-index:0}

/* ═══ Header ═══ */
.header{position:relative;z-index:2;text-align:center;padding:40px 20px 20px}
.header h1{font-family:'Ma Shan Zheng','STKaiti',cursive;font-size:52px;background:linear-gradient(180deg,#d4a853,#8b6914);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:14px}
.header p{color:#887c6a;margin-top:8px;font-size:16px;letter-spacing:4px}

/* ═══ Tabs ═══ */
.tabs{position:relative;z-index:2;display:flex;justify-content:center;gap:12px;padding:14px 20px;flex-wrap:wrap}
.tab{padding:10px 24px;border:1.5px solid #5a4a2a;background:transparent;color:#a89878;font-size:16px;cursor:pointer;border-radius:4px;transition:all .3s;font-family:inherit;letter-spacing:.06em}
.tab:hover{border-color:var(--gold);color:var(--gold)}
.tab.active{background:linear-gradient(135deg,#2a1a08,#4a2a10);border-color:var(--gold);color:#ffd700}

/* ═══ Gallery ═══ */
.gallery{position:relative;z-index:2;display:flex;flex-wrap:wrap;justify-content:center;gap:32px;padding:18px 32px 64px;max-width:1860px;margin:0 auto}

/* ═══ CARD FRAME — element-colored triple border ═══ */
.card-wrap{width:var(--card-w);height:var(--card-h);perspective:1200px}
.card{
  width:100%;height:100%;position:relative;
  background:linear-gradient(170deg,#1a1412 0%,#0d0a08 40%,#12100e 100%);
  border-radius:14px;overflow:hidden;cursor:pointer;
  box-shadow:0 0 0 2px var(--bc),0 0 0 5px #0a0a0c,0 0 0 6px var(--bc),
             0 8px 32px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.03);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .3s ease;
}
.card:hover{
  transform:translateY(-8px) rotateX(2deg);
  box-shadow:0 0 0 2px var(--bc),0 0 0 5px #0a0a0c,0 0 0 6px var(--bc),
             0 0 40px var(--bc-glow),0 16px 48px rgba(0,0,0,.7);
}
.card::before{content:'';position:absolute;top:0;left:15px;right:15px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);z-index:20}
.card::after{content:'';position:absolute;bottom:0;left:15px;right:15px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);z-index:20}

/* ═══ COST BADGE (diamond) ═══ */
.cost-badge{position:absolute;top:-2px;left:-2px;width:50px;height:50px;background:linear-gradient(135deg,#1a1a2e,#0d0d1a);clip-path:polygon(50% 0,100% 0,100% 100%,50% 100%,0 50%);display:flex;align-items:center;justify-content:center;z-index:22;border:2px solid var(--gold-dim);border-radius:0 0 4px 0}
.cost-num{font-family:'Cinzel',serif;font-size:26px;font-weight:900;color:var(--gold);text-shadow:0 0 8px rgba(200,164,92,.5);margin-left:6px}

/* ═══ ELEMENT BADGE (top-right, wuji) ═══ */
.elem-badge{position:absolute;top:-2px;right:-2px;width:56px;height:50px;border:2px solid;border-radius:0 0 0 8px;display:flex;align-items:center;justify-content:center;z-index:22}
.elem-badge.deceptive{border-color:rgba(167,139,250,.55);background:rgba(139,92,246,.2);box-shadow:0 0 14px rgba(167,139,250,.2)}
.elem-badge.domineering{border-color:rgba(239,68,68,.55);background:rgba(239,68,68,.2);box-shadow:0 0 14px rgba(239,68,68,.2)}
.elem-badge.skillful{border-color:rgba(34,197,94,.55);background:rgba(34,197,94,.2);box-shadow:0 0 14px rgba(34,197,94,.2)}
.elem-badge.spirit{border-color:rgba(200,200,210,.5);background:rgba(180,180,190,.22);box-shadow:0 0 16px rgba(255,255,255,.15)}
.elem-char{font-family:'Ma Shan Zheng','STKaiti',cursive;font-size:32px;font-weight:700;line-height:1}
.elem-badge.deceptive .elem-char{color:#c4b5fd;text-shadow:0 0 10px rgba(167,139,250,.5)}
.elem-badge.domineering .elem-char{color:#fca5a5;text-shadow:0 0 10px rgba(239,68,68,.5)}
.elem-badge.skillful .elem-char{color:#86efac;text-shadow:0 0 10px rgba(34,197,94,.5)}
.elem-badge.spirit .elem-char{color:#ffffff;text-shadow:0 0 12px rgba(255,255,255,.55),0 0 24px rgba(255,255,255,.2)}

/* ═══ INNER CRYSTAL (top-right, xinfa) ═══ */
.inner-badge{position:absolute;top:-2px;right:-2px;z-index:22}
.inner-crystal{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#38bdf8,#0ea5e9 40%,#0369a1);border:2px solid rgba(14,165,233,.6);display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px rgba(14,165,233,.35),inset 0 1px 0 rgba(255,255,255,.3)}
.inner-num{font-family:'Cinzel',serif;font-size:26px;font-weight:900;color:#0c1929;text-shadow:0 0 6px rgba(14,165,233,.4);line-height:1}

/* ═══ ART ZONE ═══ */
.card-art{position:relative;width:100%;height:55%;overflow:hidden}
.art-bg{position:absolute;inset:0}
.art-bg.wuji{background:radial-gradient(ellipse at 30% 40%,rgba(139,92,246,.2),transparent 50%),radial-gradient(ellipse at 70% 60%,rgba(192,57,43,.12),transparent 50%),linear-gradient(180deg,#1a0a2e,#0d0a08 30%,#120a1a 70%,#0a0a0c)}
.art-bg.xinfa{background:radial-gradient(ellipse at 50% 30%,rgba(14,165,233,.12),transparent 50%),radial-gradient(ellipse at 70% 50%,rgba(200,164,92,.06),transparent 50%),linear-gradient(180deg,#0a1628,#0d0a08 30%,#0a1220 70%,#0a0a0c)}

.needles{position:absolute;inset:0;pointer-events:none}
.needle{position:absolute;background:linear-gradient(90deg,transparent,rgba(200,164,92,.7),transparent);height:1px}
.needle-glow{position:absolute;width:8px;height:8px;background:rgba(200,164,92,.5);border-radius:50%;box-shadow:0 0 20px 8px rgba(200,164,92,.25),0 0 50px 15px rgba(200,164,92,.08);animation:pulse 2.5s ease-in-out infinite}

.rings{position:absolute;inset:0;pointer-events:none}
.ring{position:absolute;top:50%;left:50%;border:1.5px solid rgba(200,164,92,.1);border-radius:50%;animation:spin 20s linear infinite}
.ring:nth-child(2){animation-duration:15s;border-color:rgba(14,165,233,.07)}
.ring:nth-child(3){animation-duration:25s;border-color:rgba(200,164,92,.05)}
.ring-dot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:6px;height:6px;background:rgba(14,165,233,.35);border-radius:50%;box-shadow:0 0 16px 6px rgba(14,165,233,.12);animation:pulse 3s ease-in-out infinite}

@keyframes pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
@keyframes spin{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}

.art-watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Ma Shan Zheng','STKaiti',cursive;font-size:120px;color:rgba(200,164,92,.08);pointer-events:none;z-index:1;white-space:nowrap;user-select:none}

.art-gradient-top{position:absolute;top:0;left:0;right:0;height:44px;background:linear-gradient(180deg,rgba(10,10,12,.7),transparent);pointer-events:none;z-index:4}
.art-gradient-bot{position:absolute;bottom:0;left:0;right:0;height:34px;background:linear-gradient(0deg,rgba(13,10,8,.8),transparent);pointer-events:none;z-index:4}
.flavor-text{position:absolute;bottom:12px;left:14px;right:14px;font-family:'Ma Shan Zheng','STKaiti',cursive;font-size:13px;font-style:italic;color:rgba(200,164,92,.55);text-shadow:0 1px 3px rgba(0,0,0,.8);text-align:left;line-height:1.5;letter-spacing:.06em;pointer-events:none;z-index:5}

/* ═══ INFO ZONE ═══ */
.card-info{padding:10px 14px 8px;position:relative;flex:1}
.name-row{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.card-name{font-size:24px;font-weight:700;color:var(--text-primary);letter-spacing:.07em;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.type-badge{font-size:11px;padding:2px 8px;border-radius:3px;letter-spacing:.1em}
.type-wuji{background:rgba(139,92,246,.12);color:#a78bfa;border:1px solid rgba(139,92,246,.2)}
.type-xinfa{background:rgba(14,165,233,.1);color:#7dd3fc;border:1px solid rgba(14,165,233,.2)}
.type-neigong{background:rgba(245,158,11,.1);color:#fcd34d;border:1px solid rgba(245,158,11,.2)}

.tags-row{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.tag{font-size:10px;padding:2px 7px;border-radius:3px;background:rgba(200,164,92,.08);color:var(--gold-dim);border:1px solid rgba(200,164,92,.15);letter-spacing:.08em}

.stats-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;padding:6px 0;border-top:1px solid rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.04)}
.stat-block{display:flex;align-items:baseline;gap:5px}
.stat-label{font-size:12px;color:var(--text-dim);letter-spacing:.1em}
.stat-value{font-family:'Cinzel',serif;font-weight:700;letter-spacing:.04em}
.stat-value.power{font-size:32px;color:var(--gold);text-shadow:0 0 10px rgba(200,164,92,.4)}
.stat-value.power.zero{font-size:26px;color:var(--text-dim);text-shadow:none}
.stat-value.inner{font-size:18px;color:#2d6a4f}

.effect-desc{font-size:17px;color:var(--text-dim);line-height:1.55;letter-spacing:.03em;font-family:'STKaiti','KaiTi','楷体','SimKai','Microsoft YaHei',serif}
.effect-desc .kw{color:#a78bfa;font-weight:700}
.effect-desc .dmg{color:#c0392b;font-weight:700}
.effect-desc .num{color:var(--gold);font-weight:700}

.faction-line{display:flex;justify-content:flex-end;margin-top:5px}
.faction-badge{font-size:11px;padding:2px 9px;border-radius:3px;letter-spacing:.12em}
.faction-modeng{background:rgba(192,57,43,.12);color:#e74c3c;border:1px solid rgba(192,57,43,.25)}
.faction-wudang{background:rgba(39,174,96,.1);color:#2ecc71;border:1px solid rgba(39,174,96,.2)}
.faction-yintang{background:rgba(109,40,217,.12);color:#8b5cf6;border:1px solid rgba(109,40,217,.25)}
.faction-public{background:rgba(200,164,92,.08);color:var(--gold);border:1px solid rgba(200,164,92,.2)}

/* ═══ SSR EFFECTS (绝学) ═══ */
.card-wrap.ssr .card{box-shadow:0 0 0 2px #ffd700,0 0 0 5px #0a0a0c,0 0 0 6px #b8860b,0 8px 32px rgba(0,0,0,.6),0 0 30px rgba(255,215,0,.15)}
.card-wrap.ssr .card:hover{box-shadow:0 0 0 2px #ffd700,0 0 0 5px #0a0a0c,0 0 0 6px #ffd700,0 0 50px rgba(255,215,0,.35),0 16px 48px rgba(0,0,0,.7)}
.card-wrap.ssr .card::before{background:linear-gradient(90deg,transparent,#ffd700,transparent)}
.card-wrap.ssr .card::after{background:linear-gradient(90deg,transparent,#ffd700,transparent)}

.ssr-badge{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:25;font-family:'Ma Shan Zheng','STKaiti',cursive;font-size:15px;color:#ffd700;text-shadow:0 0 12px rgba(255,215,0,.8);pointer-events:none;letter-spacing:4px;animation:ssr-pulse 1.8s ease-in-out infinite}
@keyframes ssr-pulse{0%,100%{opacity:.6;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.08)}}

.foil-overlay{position:absolute;inset:0;border-radius:14px;z-index:15;pointer-events:none;opacity:0;mix-blend-mode:overlay;transition:opacity .5s;background:linear-gradient(135deg,rgba(255,0,0,.08),rgba(255,165,0,.08) 20%,rgba(255,255,0,.08) 40%,rgba(0,255,0,.08) 60%,rgba(0,255,255,.08) 80%,rgba(128,0,255,.08));background-size:200% 200%;animation:foil-shift 4s linear infinite}
.card:hover .foil-overlay{opacity:.4}
@keyframes foil-shift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

.sweep{position:absolute;top:-50%;left:-50%;width:40%;height:200%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);transform:rotate(35deg);z-index:16;pointer-events:none;animation:ssr-sweep 2.8s ease-in-out infinite;animation-delay:.5s}
@keyframes ssr-sweep{0%{left:-60%}100%{left:120%}}

.sparkle-ct{position:absolute;inset:0;z-index:14;pointer-events:none;overflow:hidden;border-radius:14px}
.sparkle{position:absolute;background:#ffd700;border-radius:50%;animation:s-float var(--d) ease-in-out infinite;animation-delay:var(--dl);opacity:0}
@keyframes s-float{0%{opacity:0;transform:translateY(0) scale(0)}20%{opacity:var(--op)}50%{transform:translateY(var(--y)) scale(1)}80%{opacity:var(--op)}100%{opacity:0;transform:translateY(calc(var(--y)*2)) scale(0)}}

@media(max-width:768px){.gallery{gap:22px;padding:14px}.card-wrap{width:280px;height:420px}.card-name{font-size:20px}.stat-value.power{font-size:26px}}
</style>
</head>
<body>
<div class="bg-grain"></div><div class="bg-ink1"></div><div class="bg-ink2"></div>
<div class="header"><h1>江 湖 对 决</h1><p>全卡牌图鉴 · 三十九式</p></div>
<div class="tabs">
  <button class="tab active" data-f="all">全 部</button>
  <button class="tab" data-f="modeng">🩸 魔 教</button>
  <button class="tab" data-f="wudang">⚔ 武 当</button>
  <button class="tab" data-f="yintang">☠ 隐 堂</button>
  <button class="tab" data-f="public">✦ 公 共</button>
</div>
<div class="gallery" id="g"></div>

<script>
const EM = {deceptive:'诡',domineering:'霸',skillful:'巧',spirit:'灵'};
const FN = {modeng:'魔教',wudang:'武当',yintang:'隐堂',public:'公共'};

// element → {border-color, glow}
const EC = {
  deceptive:  {c:'#a78bfa', g:'rgba(167,139,250,.25)'},
  domineering:{c:'#ef4444', g:'rgba(239,68,68,.25)'},
  skillful:   {c:'#22c55e', g:'rgba(34,197,94,.25)'},
  spirit:     {c:'#ffffff', g:'rgba(255,255,255,.22)'},
};
// 心法统一海蓝（SSR 除外）
const XINFA_BC = {c:'#0ea5e9', g:'rgba(14,165,233,.22)'};

function bc(card){
  // SSR → handled by .ssr class override, pass element color as fallback
  var xf = card.t==='xinfa'||card.t==='neigong';
  // 心法：统一海蓝边框（SSR 绝学在 CSS 中用 .ssr 覆盖为金色）
  if(xf) return XINFA_BC;
  // 武技：严格按四象元素
  return EC[card.e]||EC.domineering;
}

function hi(s){
  return s
    .replace(/\[([^\]]+)\]/g,'<span class="kw">[$1]</span>')
    .replace(/(\d+)\s*(点|张|层)/g,'<span class="dmg">$1 $2</span>')
    .replace(/战力\s*[+\-]?\s*(\d+)/g,'战力 <span class="num">$1</span>')
    .replace(/消耗\s*[+\-]?\s*(\d+)/g,'消耗 <span class="num">$1</span>')
    .replace(/内力\s*[+\-]?\s*(\d+)/g,'内力 <span class="num">$1</span>');
}

const CARDS=[
  // === 魔教 ===
  {n:'魔门基础心法',t:'xinfa',f:'modeng',c:0,p:2,i:1,e:'domineering',d:'常驻。此卡在弃牌堆中时，你仍获得其提供的战力与内力。',fl:'魔教立派之本，逆天而行，以霸制衡。',tg:['魔教','心法'],ex:false},
  {n:'修罗饮血功',t:'xinfa',f:'modeng',c:0,p:2,i:1,e:'domineering',d:'每当你因技能效果获得[破绽]时，这张牌提供的内力+1。',fl:'饮血为引，修罗附体。以伤换力，愈战愈强。',tg:['魔教','心法'],ex:false},
  {n:'血刀大法',t:'wuji',f:'modeng',c:2,p:7,i:0,e:'domineering',d:'[震伤]。若判断区内敌方盖放[巧]或[诡]，战力额外+2',fl:'血刀既出，必饮血归。魔道至上，无坚不摧。',tg:['魔教','刀法','震伤'],ex:false},
  {n:'祭血连环斩',t:'wuji',f:'modeng',c:4,p:10,i:0,e:'domineering',d:'若你有破绽，此牌消耗-2，基础战力-3，打出后抽1张牌',fl:'一刀见血，刀刀连环。愈战愈狂，势不可挡。',tg:['魔教','刀法'],ex:false},
  {n:'狂骨碎岩拳',t:'wuji',f:'modeng',c:1,p:3,i:0,e:'domineering',d:'[震伤]。若打出此卡时你拥有[破绽]，战力+3。',fl:'拳出碎骨，力透山岩。魔教真传，至刚至猛。',tg:['魔教','拳法','震伤'],ex:false},
  {n:'血海魔录',t:'wuji',f:'modeng',c:3,p:1,i:0,e:'domineering',d:'将弃牌堆/场上2张[魔教]移出游戏，从额外卡组选1张加入手牌，并抽1张牌。',fl:'以血为墨，书成魔录。魔教秘典，只传血裔。',tg:['魔教','秘术'],ex:false},
  {n:'魔刀·泣血',t:'wuji',f:'modeng',c:4,p:14,i:0,e:'domineering',d:'[震伤]。不受卡效果影响。战力上升对方弃牌堆卡牌费用。低血量时震伤变为对方随机弃2张手牌。',fl:'刀出泣血，鬼神皆惊。一刀既出，不死不休。',tg:['魔教','刀法','震伤'],ex:true},
  {n:'天魔解体',t:'wuji',f:'modeng',c:4,p:10,i:0,e:'domineering',d:'损失1点血，获被动：手牌上限10，每次[命中]抽1张。下回合可不支付消耗使用武技牌。',fl:'自损经脉，换取天威。一去不返，玉石俱焚。',tg:['魔教','外功'],ex:true},
  {n:'修罗化血阵',t:'xinfa',f:'modeng',c:3,p:3,i:4,e:'domineering',d:'本局剩余时间，每次打出带[震伤]词条的牌，对方失去1点内力。',fl:'布阵化血，修罗降世。阵中之人，血尽方休。',tg:['魔教','心法'],ex:true},
  // === 武当 ===

function nPos(n){var s='';for(var j=0;j<n;j++)s+='<div class="needle" style="top:'+(12+Math.random()*70)+'%;left:'+(5+Math.random()*85)+'%;width:'+(40+Math.random()*70)+'px;transform:rotate('+(-25+Math.random()*20)+'deg)"></div>';return s;}
function spkl(n){var s='';for(var i=0;i<n;i++){var x=Math.random()*100,y=Math.random()*100,d=2+Math.random()*3,dl=Math.random()*4,sz=1.5+Math.random()*2.5,op=.35+Math.random()*.55;s+='<div class="sparkle" style="left:'+x+'%;top:'+y+'%;width:'+sz+'px;height:'+sz+'px;--d:'+d+'s;--dl:'+dl+'s;--y:'+(-25-Math.random()*35)+'px;--op:'+op+'"></div>';}return s;}

function card(c){
  var xf=c.t==='xinfa'||c.t==='neigong';
  var wm=c.n.charAt(0);
  var pc=c.p===0?' zero':'';
  var ssr=c.ex?' ssr':'';
  var ssrB=c.ex?'<div class="ssr-badge">✦ 绝 学 ✦</div>':'';
  var foil=c.ex?'<div class="foil-overlay"></div>':'';
  var sweep=c.ex?'<div class="sweep"></div>':'';
  var sparks=c.ex?'<div class="sparkle-ct">'+spkl(14)+'</div>':'';
  var b=bc(c);
  return '<div class="card-wrap'+ssr+'" data-f="'+c.f+'" style="--bc:'+b.c+';--bc-glow:'+b.g+'">'+
    '<div class="card">'+ssrB+foil+sweep+sparks+
      '<div class="cost-badge"><span class="cost-num">'+c.c+'</span></div>'+
      (xf
        ?'<div class="inner-badge"><div class="inner-crystal"><span class="inner-num">'+c.i+'</span></div></div>'
        :'<div class="elem-badge '+c.e+'"><span class="elem-char">'+EM[c.e]+'</span></div>'
      )+
      '<div class="card-art">'+
        '<div class="art-bg '+(xf?'xinfa':'wuji')+'">'+
          (xf
            ?'<div class="rings"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="ring-dot"></div></div>'
            :'<div class="needles">'+nPos(10)+'<div class="needle-glow" style="top:35%;left:30%"></div></div>'
          )+
        '</div>'+
        '<div class="art-watermark">'+wm+'</div>'+
        '<div class="art-gradient-top"></div><div class="art-gradient-bot"></div>'+
        '<div class="flavor-text">'+c.fl+'</div>'+
      '</div>'+
      '<div class="card-info">'+
        '<div class="name-row">'+
          '<span class="card-name">'+c.n+'</span>'+
          '<span class="type-badge type-'+c.t+'">'+(c.t==='wuji'?'武技':c.t==='xinfa'?'心法':'内功')+'</span>'+
        '</div>'+
        '<div class="tags-row">'+c.tg.map(function(t){return'<span class="tag">'+t+'</span>'}).join('')+'</div>'+
        '<div class="stats-row">'+
          '<div class="stat-block"><span class="stat-label">战力</span><span class="stat-value power'+pc+'">'+c.p+'</span></div>'+
          '<div class="stat-block"><span class="stat-label">内力</span><span class="stat-value inner">'+c.i+'</span></div>'+
        '</div>'+
        '<div class="effect-desc">'+hi(c.d)+'</div>'+
        '<div class="faction-line"><span class="faction-badge faction-'+c.f+'">'+FN[c.f]+'</span></div>'+
      '</div>'+
    '</div>'+
  '</div>';
}

document.getElementById('g').innerHTML=CARDS.map(card).join('');

document.querySelectorAll('.tab').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});
    b.classList.add('active');
    var f=b.dataset.f;
    document.querySelectorAll('.card-wrap').forEach(function(w){
      w.style.display=(f==='all'||w.dataset.f===f)?'':'';
    });
  });
});
</script>
